spring.application.name=enaula

# Banco de dados PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/EnAula}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}

# JPA e Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=update

# Spring Security - testes
spring.security.user.name=admin
spring.security.user.password=123456

# ==========================================
# MINIO
# ==========================================

# Endereço local utilizado pelo Spring Boot.
minio.url=${MINIO_URL:http://localhost:9000}

# Endereço público utilizado nos links enviados aos alunos.
minio.public-url=${MINIO_PUBLIC_URL:${MINIO_URL:http://localhost:9000}}

minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}

minio.bucket.materiais=material-apoio
minio.bucket.fotos=fotos-perfil
minio.bucket.gravacoes=gravacoes-aula

# ==========================================
# DAILY API
# ==========================================

daily.api-key=${DAILY_API_KEY:}
daily.api-url=https://api.daily.co/v1

# ==========================================
# UPLOAD DE ARQUIVOS
# ==========================================

spring.servlet.multipart.resolve-lazily=true

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ==========================================
# EMAIL
# ==========================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:enaulasistema@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# CANCELAMENTO
# ==========================================

enaula.cancelamento.horas-antecedencia=24

# ==========================================
# HU024 - HISTÓRICO DE AULAS
# ==========================================

# Prazo de retenção das gravações.
enaula.gravacao.retencao-dias=${ENAULA_GRAVACAO_RETENCAO_DIAS:30}

# Validade do link de download: 24 horas.
enaula.gravacao.link-validade-segundos=${ENAULA_GRAVACAO_LINK_VALIDADE_SEGUNDOS:86400}