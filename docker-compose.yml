services:
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: enaula-minio
    restart: unless-stopped

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_DEFAULT_BUCKETS: material-apoio,fotos-perfil,gravacoes-aula
      MINIO_SCHEME: http

    volumes:
      - minio_data:/bitnami/minio/data

volumes:
  minio_data: