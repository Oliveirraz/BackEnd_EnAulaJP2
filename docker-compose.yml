version: "3.8"

services:
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: enaula-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_DEFAULT_BUCKETS=material-apoio,fotos-perfil
      - MINIO_SCHEME=http
    volumes:
      - minio_data:/bitnami/minio/data

volumes:
  minio_data: